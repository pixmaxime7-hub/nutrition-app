<style>
  :root{
    --bg: #F7F8F3;
    --surface: #FFFFFF;
    --surface-soft: #F1F4EC;
    --line: #E7EBE1;
    --ink: #1C2620;
    --ink-dim: #66766B;
    --ink-faint: #99A69C;

    --protein: #E4572E;
    --protein-soft: #FCE7DE;
    --carbs: #F0A93C;
    --carbs-soft: #FCF0DA;
    --fat: #1E9C8B;
    --fat-soft: #DCF3EF;
    --fiber: #6FA84A;
    --fiber-soft: #E9F3E0;

    --brand: #1D7A5F;
    --brand-dark: #145C47;
    --brand-soft: #E1F1E9;
    --success: #2FA84F;
    --warning: #E4A317;
    --danger: #E14F4F;
    --danger-soft: #FBE6E4;

    --micro-1: #B27C3E;
    --micro-2: #F2994A;
    --micro-3: #3E8E8A;
    --micro-4: #C79A3E;
    --micro-5: #4A78B5;
    --micro-6: #8B6BB5;

    --radius: 20px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --shadow-card: 0 1px 2px rgba(28,38,32,0.04), 0 10px 24px -14px rgba(28,38,32,0.14);
    --shadow-sheet: 0 -8px 30px rgba(28,38,32,0.14);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #root{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 84px;
    background: var(--bg);
  }

  ::selection{ background: var(--carbs-soft); }
  button{ font-family: inherit; }
  input, select{ font-family: inherit; }
  a, button{ cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  /* Header */
  .topbar{
    padding: 22px 20px 6px;
    display:flex;
    align-items:baseline;
    justify-content: space-between;
  }
  .topbar .brand-mark{
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .topbar .brand-mark b{ color: var(--brand); }
  .topbar .date{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    text-transform: capitalize;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .settings-btn{
    width:30px; height:30px;
    flex-shrink:0;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface-soft);
    border: 1px solid var(--line);
    color: var(--ink-dim);
  }
  .settings-btn svg{ width:16px; height:16px; }
  .settings-btn:active{ background: var(--line); }

  .screen{ padding: 8px 20px 20px; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px); } to{ opacity:1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .screen{ animation: none; }
    *{ transition: none !important; animation-duration: 0.001ms !important; }
  }

  h1.page-title{
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    margin: 4px 0 16px;
    color: var(--ink);
  }

  /* Cards */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-card);
  }
  .card-title{
    font-family: var(--font-display);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin: 0 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: none;
    letter-spacing: 0;
  }
  .badge.success{ background: var(--brand-soft); color: var(--brand-dark); }
  .badge.warn{ background: var(--carbs-soft); color: #8a5a10; }

  /* Calorie ring cluster */
  .ring-cluster{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6px 0 14px;
  }
  .ring-main{ position:relative; width:188px; height:188px; }
  .ring-main svg{ transform: rotate(-90deg); width:100%; height:100%; }
  .ring-main .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-center .kcal-num{
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 700;
    line-height:1;
    color: var(--ink);
  }
  .ring-center .kcal-label{
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 6px;
    text-align:center;
  }
  .ring-center .kcal-goal{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .advice-headline{
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
  }
  .advice-sub{
    font-size: 12.5px;
    color: var(--ink-dim);
    line-height: 1.4;
    margin-top: 6px;
  }
  .advice-burn-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
  }

  .macro-rings{
    display:flex;
    gap: 10px;
    margin-top: 4px;
  }
  .macro-ring-item{
    flex:1;
    background: var(--surface-soft);
    border-radius: 14px;
    padding: 12px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 7px;
    position: relative;
  }
  .macro-ring-item svg{ width:54px; height:54px; transform: rotate(-90deg); }
  .macro-ring-item .m-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
  }
  .macro-ring-item .m-val{
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .macro-ring-item .m-val .of{ color: var(--ink-faint); font-weight: 400; }
  .check-dot{
    position:absolute; top:8px; right:8px;
    width:16px; height:16px; border-radius:50%;
    background: var(--success);
    color:#fff; font-size:10px; line-height:16px; text-align:center;
  }

  /* Micro bars */
  .micro-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .micro-row:last-child{ border-bottom:none; }
  .micro-name{
    width: 92px;
    font-size: 12.5px;
    color: var(--ink-dim);
    flex-shrink:0;
  }
  .micro-track{
    flex:1;
    height: 8px;
    border-radius: 5px;
    background: var(--surface-soft);
    overflow:hidden;
    position:relative;
  }
  .micro-fill{
    height:100%;
    border-radius: 5px;
    transition: width 0.4s ease;
  }
  .micro-val{
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    width: 78px;
    text-align:right;
    flex-shrink:0;
  }
  .micro-val.over{ color: var(--danger); font-weight:600; }

  /* Meal list */
  .meal-entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .meal-entry:last-child{ border-bottom:none; }
  .meal-entry-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .meal-entry-name{ font-size: 14px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meal-entry-meta{ font-size: 11.5px; color: var(--ink-faint); font-family: var(--font-mono); }
  .meal-entry-kcal{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-dim);
    flex-shrink:0;
  }
  .del-btn{
    background:none; border:none; color: var(--ink-faint);
    font-size: 16px; padding: 4px 6px; flex-shrink:0; border-radius: 8px;
  }
  .del-btn:hover{ color: var(--danger); background: var(--danger-soft); }

  .empty-state{
    text-align:center;
    padding: 26px 10px;
    color: var(--ink-faint);
    font-size: 13px;
  }

  /* Forms */
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .field input, .field select{
    width:100%;
    background: var(--surface-soft);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 13px;
    border-radius: 11px;
    font-size: 15px;
  }
  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }

  /* Profile avatar */
  .profile-avatar-row{ display:flex; align-items:center; gap:16px; margin-bottom:18px; }
  .profile-avatar{
    position:relative;
    width:72px; height:72px;
    flex-shrink:0;
    border-radius:50%;
    background: var(--surface-soft);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    color: var(--ink-faint);
  }
  .profile-avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-avatar svg{ width:28px; height:28px; }
  .profile-avatar .avatar-initials{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight:600;
    color: var(--brand-dark);
  }
  .profile-avatar .avatar-edit-badge{
    position:absolute;
    right:-2px; bottom:-2px;
    width:24px; height:24px;
    border-radius:50%;
    background: var(--brand);
    border: 2px solid var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .profile-avatar .avatar-edit-badge svg{ width:12px; height:12px; }
  .profile-name-fields{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .profile-name-fields .field{ margin-bottom:0; }

  .btn{
    display:block;
    width:100%;
    text-align:center;
    background: var(--brand);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 14px;
    border-radius: 14px;
    border:none;
    font-family: var(--font-display);
    box-shadow: 0 8px 20px -8px rgba(29,122,95,0.55);
  }
  .btn:active{ transform: scale(0.98); }
  .btn:disabled{ opacity: 0.6; }
  .btn.secondary{
    background: var(--surface-soft);
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost{
    background: none;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    box-shadow: none;
  }

  .goal-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .goal-chip{
    background: var(--surface-soft);
    border-radius: 13px;
    padding: 11px 13px;
  }
  .goal-chip .g-label{ font-size: 11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; }
  .goal-chip .g-val{ font-family: var(--font-mono); font-size: 16px; margin-top:3px; color: var(--ink); font-weight:600; }

  /* Search / food list */
  .search-wrap{ margin-bottom: 12px; }
  .search-wrap input{
    width:100%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 13px 15px;
    border-radius: 13px;
    font-size: 15px;
    box-shadow: var(--shadow-card);
  }
  .cat-tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cat-tab{
    flex:1;
    padding: 9px 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
    text-align:center;
  }
  .cat-tab.active{
    background: var(--brand);
    color: #fff;
    border-color: var(--brand);
  }
  .food-list{ display:flex; flex-direction:column; gap:8px; }
  .food-item{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow: var(--shadow-card);
  }
  .food-item:active{ background: var(--surface-soft); }
  .food-item-name{ font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .food-item-kcal{ font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }

  .meal-type-tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
    overflow-x:auto;
  }
  .meal-type-tab{
    flex-shrink:0;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
  }
  .meal-type-tab.active{
    background: var(--carbs);
    color: #4a2f00;
    border-color: var(--carbs);
  }

  .portion-panel{
    position: fixed;
    inset: 0;
    background: rgba(28,38,32,0.35);
    display:flex;
    align-items:flex-end;
    z-index: 50;
  }
  .portion-sheet{
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px 26px;
    width:100%;
    max-width: 480px;
    margin: 0 auto;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-sheet);
  }
  .portion-sheet h3{
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .portion-sheet .food-per100{
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    margin-bottom: 16px;
  }
  .quick-portions{
    display:flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .quick-portion-btn{
    flex:1;
    min-width: 60px;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-soft);
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
  }
  .quick-portion-btn.active{
    background: var(--brand-soft);
    border-color: var(--brand);
    color: var(--brand-dark);
  }
  .portion-preview{
    display:flex;
    gap: 12px;
    margin: 14px 0 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }
  .portion-preview span b{ color: var(--ink); }

  .ask-row{
    background: var(--surface-soft);
    border-radius: 14px;
    padding: 12px 14px;

     Si l'app tourne en dehors de claude.ai (fichier HTML ouvert directement,

     On le remplace alors par un stockage équivalent basé sur localStorage,
     propre à cet appareil/navigateur, pour que les données soient quand
     même sauvegardées.
  --------------------------------------------------------------------- */
  if(typeof window.storage === 'undefined'){
    const LS_PREFIX = 'nutripanel_ls__';
    window.storage = {
      async get(key){
        const raw = localStorage.getItem(LS_PREFIX + key);
        if(raw === null) return null;
        return { key, value: raw };
      },
      async set(key, value){
        localStorage.setItem(LS_PREFIX + key, value);
        return { key, value };
      },
      async delete(key){
        localStorage.removeItem(LS_PREFIX + key);
        return { key, deleted: true };
      },
      async list(prefix){
        const keys = [];
        for(let i=0; i<localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(LS_PREFIX)){
            const real = k.slice(LS_PREFIX.length);
            if(!prefix || real.startsWith(prefix)) keys.push(real);
          }
        }
        return { keys };
      },

  function shadeColor(hex, percent){
    hex = hex.replace('#','');
    if(hex.length === 3) hex = hex.split('').map(c => c+c).join('');
    const num = parseInt(hex, 16);
    let r = (num >> 16) & 255;
    let g = (num >> 8) & 255;
    let b = num & 255;
    const t = percent < 0 ? 0 : 255;
    const p = Math.abs(percent) / 100;
    r = Math.round((t - r) * p) + r;
    g = Math.round((t - g) * p) + g;
    b = Math.round((t - b) * p) + b;
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  function applyThemeVars(theme){
    const root = document.documentElement;
    root.style.setProperty('--brand', theme.accent);
    root.style.setProperty('--brand-dark', shadeColor(theme.accent, -18));
    root.style.setProperty('--brand-soft', shadeColor(theme.accent, 84));
    root.style.setProperty('--bg', theme.bg);
  }

  /* ---------------------------------------------------------------------
     CALCUL DES OBJECTIFS
  --------------------------------------------------------------------- */
  function computeTargets(p){
    const bmr = p.sexe === 'homme'
      ? 10*p.poids + 6.25*p.taille - 5*p.age + 5
      : 10*p.poids + 6.25*p.taille - 5*p.age - 161;

    const activityMap = { sedentaire:1.2, leger:1.375, modere:1.55, actif:1.725, tresActif:1.9 };
    const tdee = bmr * (activityMap[p.activite] || 1.2);

    let calories;
    if (p.objectif === 'perte') calories = tdee * 0.8;
    else if (p.objectif === 'prise') calories = tdee * 1.15;
    else calories = tdee;

    const proteinPerKg = p.objectif === 'perte' ? 2.2 : (p.objectif === 'prise' ? 2.0 : 1.8);
    const protein = proteinPerKg * p.poids;
    const fat = (calories * 0.25) / 9;
    const carbs = Math.max((calories - protein*4 - fat*9) / 4, 0);

    const isMan = p.sexe === 'homme';

    return {
      calories: Math.round(calories),
      protein: Math.round(protein),
      carbs: Math.round(carbs),
      fat: Math.round(fat),
      fiber: isMan ? 38 : 25,
      vitC: isMan ? 90 : 75,
      iron: isMan ? 8 : 18,
      calcium: 1000,
      vitD: 15,
      potassium: 3400,
      magnesium: isMan ? 400 : 310,
      sodiumMax: 2300,
    };
  }

      state.profile = profileRes ? JSON.parse(profileRes.value) : null;
    }catch(e){ state.profile = null; }

    try{
      const listRes = await window.storage.list('nutripanel:log:', false);
      const keys = (listRes && listRes.keys) || [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, false);
          if(r){
            const dateStr = k.replace('nutripanel:log:', '');
            state.logs[dateStr] = JSON.parse(r.value);
          }
        }catch(e){ /* ignore */ }
      }
    }catch(e){ /* no logs yet */ }

    try{
      const listRes = await window.storage.list('nutripanel:session:', false);
      const keys = (listRes && listRes.keys) || [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, false);
          if(r){
            const session = JSON.parse(r.value);
            state.sessions[session.id] = session;
          }
        }catch(e){ /* ignore */ }
      }
    }catch(e){ /* no sessions yet */ }

    try{
      const listRes = await window.storage.list('nutripanel:activity:', false);
      const keys = (listRes && listRes.keys) || [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, false);
          if(r){
            const activity = JSON.parse(r.value);
            state.activities[activity.id] = activity;
          }
        }catch(e){ /* ignore */ }
      }
    }catch(e){ /* no activities yet */ }

    try{
      const listRes = await window.storage.list('nutripanel:customfood:', false);
      const keys = (listRes && listRes.keys) || [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, false);
          if(r){
            const food = JSON.parse(r.value);
            state.customFoods[food.id] = food;
          }
        }catch(e){ /* ignore */ }
      }
    }catch(e){ /* no custom foods yet */ }

    try{
      const themeRes = await window.storage.get('nutripanel:theme', false);
      if(themeRes){ state.theme = { ...DEFAULT_THEME, ...JSON.parse(themeRes.value) }; }
    }catch(e){ /* default theme */ }
    applyThemeVars(state.theme);

    state.loaded = true;
    state.afterSplashScreen = state.profile ? 'today' : 'welcome';
    state.screen = 'splash';
    if(state.profile){
      await maybeAutoGenerateWeekPlan();
      await maybeShowWeeklyRecap();
    }
    render();
  }

  /* ---------------------------------------------------------------------
     TOTAUX DU JOUR
  --------------------------------------------------------------------- */
  function dayTotals(dateKey){
    const entries = state.logs[dateKey] || [];
    const totals = { kcal:0, protein:0, carbs:0, fat:0, fiber:0, vitC:0, iron:0, calcium:0, vitD:0, potassium:0, magnesium:0, sodium:0 };
    for(const e of entries){
      totals.kcal += e.kcal;
      for(const k of NUTRIENT_KEYS) totals[k] += e[k];
    }
    return totals;
  }

  function round1(n){ return Math.round(n*10)/10; }

  function computeDailyAdvice(totals, burnedKcal, t){
    const now = new Date();
    const hour = now.getHours() + now.getMinutes() / 60;
    const dayStart = 7, dayEnd = 22;
    const dayPct = Math.max(0, Math.min((hour - dayStart) / (dayEnd - dayStart), 1));

    const adjustedGoal = t.calories + burnedKcal;
    const remaining = adjustedGoal - totals.kcal;
    const expected = adjustedGoal * dayPct;

    let icon, headline, sub = '';

    if(totals.kcal === 0 && burnedKcal === 0 && hour < 10){
      icon = '🌅';
      headline = "Bonne journée ! Pense à enregistrer ton petit-déjeuner pour bien démarrer le suivi.";
    } else if(remaining < 0){
      icon = '⚠️';
      headline = `Objectif dépassé de ${Math.round(-remaining)} kcal aujourd'hui.`;
      sub = "Privilégie un repas léger pour le reste de la journée.";
    } else if(hour < 18 && expected > 100 && totals.kcal > expected * 1.25){
      icon = '📊';
      headline = "Tu avances vite sur tes calories par rapport à l'heure qu'il est.";
      sub = "Essaie de garder tes prochains repas plus légers pour finir la journée dans les clous.";
    } else if(hour > 14 && expected > 200 && totals.kcal < expected * 0.5){
      icon = '🍽️';
      headline = "Tu es en dessous du rythme aujourd'hui.";
      sub = "N'oublie pas de manger suffisamment d'ici ce soir pour couvrir tes besoins.";
    } else if(burnedKcal > 0 && remaining > t.calories * 0.3){
      icon = '🔥';
      headline = `Belle dépense aujourd'hui — il te reste environ ${Math.round(remaining)} kcal à consommer.`;
      sub = "De quoi bien manger sans culpabiliser.";
    } else {
      icon = '👍';
      headline = remaining > 20
        ? `Tu es sur la bonne voie — il te reste environ ${Math.round(remaining)} kcal pour aujourd'hui.`
        : "Tu es exactement dans ton objectif aujourd'hui.";
    }

    if(!sub && t.protein && dayPct > 0.3){
      const proteinExpected = t.protein * dayPct;
      if(totals.protein < proteinExpected * 0.6){
        sub = "Pense à ajouter une source de protéines à ton prochain repas (poulet, œufs, yaourt, whey…).";
      }
    }

    return { icon, headline, sub, remaining, adjustedGoal };
  }
  /* ---------------------------------------------------------------------
     RÉCAP HEBDOMADAIRE
  --------------------------------------------------------------------- */
  function mondayForDate(d){
    const day = d.getDay(); // 0=dim, 1=lun...
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + diffToMonday);
    return monday;
  }

  function dateKeyFromDate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function weekDatesFromMonday(monday){
    const dates = [];
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      dates.push(dateKeyFromDate(d));
    }
    return dates;
  }

  function getPreviousWeekDates(){
    const thisMonday = mondayForDate(new Date());
    const prevMonday = new Date(thisMonday);
    prevMonday.setDate(thisMonday.getDate() - 7);
    return weekDatesFromMonday(prevMonday);
  }

  function weekRangeLabel(dates){
    const start = new Date(dates[0] + 'T00:00:00');
    const end = new Date(dates[6] + 'T00:00:00');
    const opts = { day:'numeric', month:'short' };
    return `${start.toLocaleDateString('fr-FR', opts)} – ${end.toLocaleDateString('fr-FR', opts)}`;
  }

  function weekNutritionSummary(dates){
    const sum = { kcal:0, protein:0, carbs:0, fat:0, fiber:0, vitC:0, iron:0, calcium:0, vitD:0, potassium:0, magnesium:0, sodium:0 };
    let daysLogged = 0;
    dates.forEach(dk => {
      const entries = state.logs[dk] || [];
      if(entries.length > 0) daysLogged++;
      const dayT = dayTotals(dk);
      for(const k in sum) sum[k] += dayT[k];
    });
    const divisor = daysLogged || 1;
    const avg = {};
    for(const k in sum) avg[k] = sum[k] / divisor;
    return { sum, avg, daysLogged };
  }

  function weekTrainingSummary(dates){
    const sessions = dates.flatMap(dk => sessionsForDate(dk));
    const finished = sessions.filter(s => s.status === 'terminee');
    const totalSets = finished.reduce((acc, s) => acc + sessionStats(s).totalSets, 0);
    const groupsSet = new Set();
    finished.forEach(s => sessionStats(s).groups.forEach(g => groupsSet.add(g)));
    return { totalSessions: sessions.length, finishedSessions: finished.length, totalSets, groups: [...groupsSet] };
  }

  async function maybeShowWeeklyRecap(){
    if(new Date().getDay() !== 1) return; // uniquement le lundi
    const dates = getPreviousWeekDates();
    const weekStart = dates[0];
    let lastShown = null;
    try{
      const r = await window.storage.get('nutripanel:lastRecapWeek', false);
      lastShown = r ? r.value : null;
    }catch(e){ /* ignore */ }
    if(lastShown === weekStart) return; // déjà vu cette semaine
    state.weeklyRecapOpen = true;
    state.weeklyRecapWeekStart = weekStart;
    state.weeklyRecapDates = dates;
    state.weeklyRecapStep = 'recap';
  }

  async function closeWeeklyRecap(){
    const weekStart = state.weeklyRecapWeekStart;
    state.weeklyRecapOpen = false;
    state.weeklyRecapStep = 'recap';
    if(weekStart){

    }
    render();
  }

  /* ---------------------------------------------------------------------
     RENDU: RINGS SVG
  --------------------------------------------------------------------- */
  function ringSvg(size, stroke, pct, color, trackColor){
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const clamped = Math.max(0, Math.min(pct, 1));
    const offset = c * (1 - clamped);
    return `
      <svg viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
      </svg>`;
  }

  function getWeekDates(){
    const now = new Date();
    const day = now.getDay(); // 0=dim, 1=lun...
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday);
    const dates = [];
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    }
    return dates;
  }

  function sessionsForDate(dateStr){
    return Object.values(state.sessions).filter(s => s.date === dateStr).sort((a,b) => a.id < b.id ? -1 : 1);
  }

  function defaultSessionName(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const label = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    return 'Séance du ' + label;
  }

  function sessionStats(session){
    const totalSets = session.exercises.reduce((s,e) => s + (e.sets || 0), 0);
    const groups = [...new Set(session.exercises.map(e => e.group))];
    return { totalSets, groups };
  }

  function formatExerciseStat(e){
    return `${e.sets} séries × ${e.reps} reps${e.weight ? ' · ' + e.weight + ' kg' : ''}`;
  }

  function computeSessionAnalysis(session){
    const earlierSessions = Object.values(state.sessions)
      .filter(s => s.id !== session.id && s.status === 'terminee' &&
        (s.date < session.date || (s.date === session.date && s.id < session.id)))
      .sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1)));

    let progressCount = 0, plateauCount = 0, newCount = 0;

    const items = session.exercises.map(ex => {
      const history = [];
      for(const s of earlierSessions){
        const match = s.exercises.find(e => e.exercise === ex.exercise);
        if(match) history.push(match);
        if(history.length >= 5) break;
      }

      if(history.length === 0){
        newCount++;
        return {
          group: ex.group, exercise: ex.exercise,
          currentLabel: formatExerciseStat(ex), prevLabel: '',
          icon: '⭐', message: 'Nouvel exercice — bon point de départ pour suivre ta progression.',
        };
      }

      const prev = history[0];
      let streak = 0;
      for(const h of history){
        if(h.weight === ex.weight && h.reps === ex.reps) streak++;
        else break;
      }

      const weightUp = ex.weight != null && prev.weight != null && ex.weight > prev.weight;
      const weightDown = ex.weight != null && prev.weight != null && ex.weight < prev.weight;
      const repsUp = ex.reps > prev.reps;
      const repsDown = ex.reps < prev.reps;
      const sameWeight = ex.weight === prev.weight;

      let icon, message;
      if(weightUp){
        progressCount++;
        icon = '💪';
        message = `Charge en hausse (+${round1(ex.weight - prev.weight)} kg) — bonne progression, continue comme ça.`;
      } else if(sameWeight && repsUp){
        progressCount++;
        icon = '💪';
        message = 'Répétitions en hausse — bonne progression.';
      } else if(sameWeight && !repsDown && streak >= 3){
        plateauCount++;
        icon = '🔄';
        message = `Même charge et répétitions depuis ${streak + 1} séances — essaie d'augmenter le poids, les répétitions, ou varie l'exercice.`;
      } else if(sameWeight && !repsDown){
        icon = '➡️';
        message = 'Charge stable par rapport à la dernière fois — encore un peu de marge pour progresser.';
      } else if(weightDown || repsDown){
        icon = '📉';
        message = 'Un peu moins que la dernière fois — normal après une grosse séance, ou écoute ton corps.';
      } else {
        icon = '➡️';
        message = 'Charge stable par rapport à la dernière fois.';
      }

      return {
        group: ex.group, exercise: ex.exercise,
        currentLabel: formatExerciseStat(ex), prevLabel: formatExerciseStat(prev),
        icon, message,
      };
    });

    return { sessionName: session.name, items, progressCount, plateauCount, newCount };
  }

  async function applyLastWeekPlan(){
    const lastDates = getPreviousWeekDates();
    const thisDates = getWeekDates();
    const lastSessions = lastDates.flatMap(d => sessionsForDate(d));

    if(lastSessions.length === 0){
      showToast('Aucune séance à reprendre la semaine dernière');
      return;
    }

    let count = 0;
    for(let i=0; i<lastSessions.length; i++){
      const s = lastSessions[i];
      const dayIdx = lastDates.indexOf(s.date);
      if(dayIdx === -1) continue;
      const newDate = thisDates[dayIdx];

      const alreadyExists = sessionsForDate(newDate).some(ex => ex.name === s.name);
      if(alreadyExists) continue;

      const newSession = {
        id: 's' + Date.now() + Math.random().toString(36).slice(2,7) + i,
        date: newDate,
        name: s.name,
        status: 'planifiee',
        exercises: s.exercises.map((e, j) => ({
          id: 'ex' + Date.now() + Math.random().toString(36).slice(2,7) + i + '_' + j,
          group: e.group,
          exercise: e.exercise,
          sets: e.sets,
          reps: e.reps,
          weight: null,
          feeling: null,
          feelingLabel: null,
        })),
      };
      await saveSession(newSession);
      count++;
    }

    render();
    showToast(count > 0
      ? `Semaine programmée (${count} séance${count>1?'s':''}) ✓`
      : 'Ces séances sont déjà programmées cette semaine');
  }

  async function createWeekPlan(dayIndices, level, dates){
    const selectedInfo = dayIndices.slice().sort((a,b)=>a-b).map(idx => ({ idx, date: dates[idx] }));
    const objectif = state.profile.objectif;
    const { sets, reps } = setsRepsFor(level, objectif);
    const templates = templatesForCount(selectedInfo.length);

    for(let i=0; i<selectedInfo.length; i++){
      const info = selectedInfo[i];
      const tpl = templates[i];
      const exercisesPicked = pickExercises(tpl.groups, i);
      const session = {
        id: 's' + Date.now() + Math.random().toString(36).slice(2,7) + i,
        date: info.date,
        name: tpl.name,
        status: 'planifiee',
        exercises: exercisesPicked.map(ex => ({
          id: 'ex' + Date.now() + Math.random().toString(36).slice(2,7),
          group: ex.group,
          exercise: ex.exercise,
          sets, reps,
          weight: null,
          feeling: null,
          feelingLabel: null,
        })),
      };
      await saveSession(session);
    }
  }

  async function saveLastPlanConfig(config){
    try{
      await window.storage.set('nutripanel:lastplan', JSON.stringify(config), false);
    }catch(e){ /* ignore */ }
  }

  async function maybeAutoGenerateWeekPlan(){
    const dates = getWeekDates();
    const hasSessionThisWeek = Object.values(state.sessions).some(s => dates.includes(s.date));
    if(hasSessionThisWeek) return;

    let lastPlan = null;
    try{
      const r = await window.storage.get('nutripanel:lastplan', false);
      if(r) lastPlan = JSON.parse(r.value);
    }catch(e){ /* ignore */ }

    if(!lastPlan || !lastPlan.days || lastPlan.days.length === 0) return;

    await createWeekPlan(lastPlan.days, lastPlan.level || 'intermediaire', dates);
  }

  async function generateAiPlan(){
    if(state.aiPlanLoading) return;
    if(state.aiPlanDays.length === 0){
      showToast('Sélectionne au moins un jour');
      return;
    }

    state.aiPlanLoading = true;
    render();

    try{
      const dates = getWeekDates();
      await createWeekPlan(state.aiPlanDays, state.aiPlanLevel, dates);
      await saveLastPlanConfig({ days: state.aiPlanDays.slice(), level: state.aiPlanLevel });

      state.aiPlanLoading = false;
      state.aiPlanOpen = false;
      state.aiPlanDays = [];
      render();
      showToast('Programme généré ✓');
    }catch(err){
      state.aiPlanLoading = false;
      render();
      showToast("Erreur lors de la génération du programme");
    }
  }

  function renderWeeklyRecapSheet(){
    const dates = state.weeklyRecapDates || getPreviousWeekDates();

    if(state.weeklyRecapStep === 'adjust'){
      return `
        <div class="portion-panel weekly-recap-panel">
          <div class="portion-sheet">

    const kcalPct = avg.kcal / t.calories;

    const carbsPct = avg.carbs / t.carbs;

    const microDefs = [

      {key:'vitD', label:'Vit. D', unit:'µg', target:t.vitD, color:'var(--micro-4)'},

            <div class="macro-ring-item">
              ${ringSvg(54, 7, kcalPct, 'var(--brand)', 'var(--surface)')}
              <div class="m-label">Kcal</div>
              <div class="m-val">${Math.round(avg.kcal)}<span class="of">/${t.calories}</span></div>
            </div>
            <div class="macro-ring-item">
              ${ringSvg(54, 7, proteinPct, 'var(--protein)', 'var(--surface)')}
              <div class="m-label">Prot.</div>
              <div class="m-val">${Math.round(avg.protein)}<span class="of">/${t.protein}g</span></div>
            </div>
            <div class="macro-ring-item">
              ${ringSvg(54, 7, carbsPct, 'var(--carbs)', 'var(--surface)')}
              <div class="m-label">Gluc.</div>
              <div class="m-val">${Math.round(avg.carbs)}<span class="of">/${t.carbs}g</span></div>

            <div class="macro-ring-item">

          ${microDefs.map(m => {

            return `
              <div class="micro-row">
                <div class="micro-name">${m.label}</div>

  function render(){
    const root = document.getElementById('root');
    if(!state.loaded){ root.innerHTML = '<div class="loading">Chargement…</div>'; return; }

    // Mémorise le champ actuellement en cours de saisie (id + position du
    // curseur) pour pouvoir lui redonner le focus après la reconstruction
    // du DOM ci-dessous, sinon le clavier se ferme et la saisie est perdue.
    const activeEl = document.activeElement;
    let focusInfo = null;
    if(activeEl && activeEl.id && root.contains(activeEl)){
      focusInfo = {
        id: activeEl.id,
        start: (typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null,
        end: (typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null,
      };
    }

    if(state.screen === 'splash'){
      root.innerHTML = renderSplash();
      return;
    }

    if(state.screen === 'welcome'){
      root.innerHTML = renderWelcome();
      return;
    }

    let body = '';
    if(!state.profile || state.screen === 'profile'){
      body = renderProfile();
    } else if(state.screen === 'today'){
      body = renderToday();
    } else if(state.screen === 'add'){
      body = renderAdd();
    } else if(state.screen === 'training'){
      body = renderTraining();
    } else if(state.screen === 'history'){
      body = renderHistory();
    }

    const showNav = !!state.profile;

    root.innerHTML = `
      <div class="topbar">
        <div class="brand-mark">Nutri<b>Panel</b></div>
        <div class="topbar-right">
          <div class="date">${new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</div>
          <button class="settings-btn" data-action="open-settings" aria-label="Réglages">${iconSettings()}</button>
        </div>
      </div>
      ${body}
      ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
      ${showNav ? `
        <div class="bottom-nav">
          <button class="nav-btn ${state.screen==='today'?'active':''}" data-action="nav" data-screen="today">${iconToday()}<span>Jour</span></button>
          <button class="nav-btn ${state.screen==='add'?'active':''}" data-action="nav" data-screen="add">${iconAdd()}<span>Ajouter</span></button>
          <button class="nav-btn ${state.screen==='training'?'active':''}" data-action="nav" data-screen="training">${iconTraining()}<span>Sport</span></button>
          <button class="nav-btn ${state.screen==='history'?'active':''}" data-action="nav" data-screen="history">${iconHistory()}<span>Historique</span></button>
          <button class="nav-btn ${state.screen==='profile'?'active':''}" data-action="nav" data-screen="profile">${iconProfile()}<span>Profil</span></button>
        </div>
      ` : ''}
      ${state.weeklyRecapOpen ? renderWeeklyRecapSheet() : ''}
      ${state.settingsOpen ? renderSettingsSheet() : ''}
    `;

    attachInputFocus(focusInfo);
  }

  function attachInputFocus(focusInfo){
    // Si un champ était en cours de saisie avant le re-render, on lui
    // redonne le focus et on remet le curseur à la même position.
    if(focusInfo && focusInfo.id){
      const el = document.getElementById(focusInfo.id);
      if(el){
        el.focus();
        if(typeof el.setSelectionRange === 'function' && focusInfo.start !== null){
          try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
        }
        return;
      }
    }
    const searchInput = document.getElementById('food-search');
    if(searchInput){
      const pos = searchInput.value.length;
      searchInput.focus();
      searchInput.setSelectionRange(pos, pos);
    }
  }

     ACTIONS

  document.addEventListener('click', async (e) => {
    if(e.target.classList && e.target.classList.contains('ai-plan-panel')){
      state.aiPlanOpen = false;
      render();
      return;
    }
    if(e.target.classList && e.target.classList.contains('session-panel')){
      state.openSessionId = null;
      render();
      return;
    }
    if(e.target.classList && e.target.classList.contains('session-analysis-panel')){
      state.sessionAnalysisOpen = false;
      state.sessionAnalysisData = null;
      render();
      return;
    }
    if(e.target.classList && e.target.classList.contains('weekly-recap-panel')){
      await closeWeeklyRecap();
      return;
    }
    if(e.target.classList && e.target.classList.contains('custom-food-panel')){
      state.customFoodOpen = false;
      render();
      return;
    }
    if(e.target.classList && e.target.classList.contains('settings-panel')){
      state.settingsOpen = false;
      render();
      return;
    }
    if(e.target.classList && e.target.classList.contains('portion-panel')){
      state.portionFood = null;
      render();
      return;
    }

    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action === 'enter-app'){
      state.screen = state.afterSplashScreen || (state.profile ? 'today' : 'welcome');
      render();
    }

    else if(action === 'start-onboarding'){
      state.screen = 'profile';
      render();
    }

    else if(action === 'nav'){
      state.screen = el.dataset.screen;
      state.portionFood = null;
      render();
    }

    else if(action === 'save-profile'){
      const age = parseInt(document.getElementById('f-age').value, 10);
      const sexe = document.getElementById('f-sexe').value;
      const poids = parseFloat(document.getElementById('f-poids').value);
      const taille = parseFloat(document.getElementById('f-taille').value);
      const activite = document.getElementById('f-activite').value;
      const objectif = document.getElementById('f-objectif').value;
      const prenom = document.getElementById('f-prenom').value.trim();
      const nom = document.getElementById('f-nom').value.trim();

      if(!age || !poids || !taille){
        showToast('Merci de remplir âge, poids et taille');
        return;
      }
      const photo = (state.profile && state.profile.photo) || state.profilePhotoDraft || null;
      const profile = { age, sexe, poids, taille, activite, objectif, prenom, nom, photo };
      profile.targets = computeTargets(profile);
      await saveProfile(profile);
      state.profilePhotoDraft = null;
      state.screen = 'today';
      showToast('Objectifs mis à jour ✓');
    }

    else if(action === 'pick-photo'){
      const input = document.getElementById('photo-input');
      if(input) input.click();
    }

    else if(action === 'edit-goals'){
      state.editingGoals = true;
      render();
    }

    else if(action === 'cancel-edit-goals'){
      state.editingGoals = false;
      render();
    }

    else if(action === 'save-goals'){
      const newTargets = { ...state.profile.targets };
      for(const f of GOAL_FIELDS){
        const input = document.getElementById('goal-'+f.key);
        const val = parseFloat(input.value);
        if(!isNaN(val)) newTargets[f.key] = val;
      }
      state.profile.targets = newTargets;
      await saveProfile(state.profile);
      state.editingGoals = false;
      render();
      showToast('Objectifs mis à jour ✓');
    }

    else if(action === 'set-category'){
      state.foodCategory = el.dataset.cat;
      render();
    }

    else if(action === 'pick-food'){
      const food = FOODS.find(f => f.id === el.dataset.food) || state.customFoods[el.dataset.food];
      state.portionFood = food;
      state.portionGrams = food.unitType === 'piece' ? 1 : 100;
      state.portionManual = false;
      const factor = portionFactor(food, state.portionGrams);
      state.manualValues = {
        kcal: Math.round(food.kcal * factor),
        protein: round1(food.protein * factor),
        carbs: round1(food.carbs * factor),
        fat: round1(food.fat * factor),
      };
      render();
    }

    else if(action === 'set-portion'){
      state.portionGrams = parseInt(el.dataset.grams, 10);
      if(!state.portionManual){
        render();
      } else {
        render();
      }
    }

    else if(action === 'set-manual'){
      const wantsManual = el.dataset.manual === '1';
      if(wantsManual && !state.portionManual){
        const f = state.portionFood;
        const factor = portionFactor(f, state.portionGrams);
        state.manualValues = {
          kcal: Math.round(f.kcal * factor),
          protein: round1(f.protein * factor),
          carbs: round1(f.carbs * factor),
          fat: round1(f.fat * factor),
        };
      }
      state.portionManual = wantsManual;
      render();
    }

    else if(action === 'cancel-portion' || action === 'close-portion-overlay'){
      state.portionFood = null;
      render();
    }

    else if(action === 'set-meal-type'){
      state.mealType = el.dataset.meal;
      render();
    }

    else if(action === 'confirm-add-food'){
      const f = state.portionFood;
      const qty = state.portionGrams;
      const factor = portionFactor(f, qty);
      const mealLabel = MEAL_TYPES.find(m => m.id === state.mealType).label;

      let kcal, protein, carbs, fat;
      if(state.portionManual){
        kcal = state.manualValues.kcal;
        protein = state.manualValues.protein;
        carbs = state.manualValues.carbs;
        fat = state.manualValues.fat;
      } else {
        kcal = f.kcal * factor;
        protein = f.protein * factor;
        carbs = f.carbs * factor;
        fat = f.fat * factor;
      }

      const entry = {
        id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
        foodId: f.id,
        name: f.name,
        grams: f.unitType === 'piece' ? Math.round(qty * f.pieceGrams) : qty,
        qty,
        unitType: f.unitType || 'weight',
        pieceLabel: f.pieceLabel,
        unit: f.unit || 'g',
        mealType: state.mealType,
        mealLabel,
        manual: state.portionManual,
        kcal, protein, carbs, fat,
        fiber: f.fiber * factor,
        vitC: f.vitC * factor,
        iron: f.iron * factor,
        calcium: f.calcium * factor,
        vitD: f.vitD * factor,
        potassium: f.potassium * factor,
        magnesium: f.magnesium * factor,
        sodium: f.sodium * factor,
      };
      const dk = todayKey();
      if(!state.logs[dk]) state.logs[dk] = [];
      state.logs[dk].push(entry);
      await saveDayLog(dk);
      state.portionFood = null;
      state.searchQuery = '';
      showToast(f.name + ' ajouté ✓');

    else if(action === 'delete-entry'){
      const dk = todayKey();
      state.logs[dk] = (state.logs[dk] || []).filter(x => x.id !== el.dataset.id);

    else if(action === 'set-training-subtab'){

    else if(action === 'start-session'){

      const session = {
        id: 's' + Date.now() + Math.random().toString(36).slice(2,7),
        date: dk,
        name: defaultSessionName(dk),
        status: 'planifiee',
        exercises: [],

      await saveSession(session);
      render();
    }

    else if(action === 'add-exercise-to-session'){
      const prefix = el.dataset.prefix;
      const sessionId = el.dataset.session;
      const session = state.sessions[sessionId];
      if(!session) return;

      const group = document.getElementById(prefix+'-group').value;
      const exerciseSelect = document.getElementById(prefix+'-exercise-select').value;
      const exercise = exerciseSelect === '__custom__'
        ? document.getElementById(prefix+'-exercise-custom').value.trim()
        : exerciseSelect;
      const sets = parseInt(document.getElementById(prefix+'-sets').value, 10);
      const reps = parseInt(document.getElementById(prefix+'-reps').value, 10);
      const weight = parseFloat(document.getElementById(prefix+'-weight').value);
      const feelingId = document.getElementById(prefix+'-feeling').value;

      if(!exercise || !sets || !reps){
        showToast('Renseigne au moins l\'exercice, les séries et les répétitions');
        return;
      }

      const feelingObj = FEELINGS.find(f => f.id === feelingId);
      session.exercises.push({
        id: 'ex' + Date.now() + Math.random().toString(36).slice(2,7),
        group, exercise, sets, reps,
        weight: isNaN(weight) ? null : weight,
        feeling: feelingId || null,
        feelingLabel: feelingId ? feelingObj.label : null,
      });
      state.trainingLastGroup = group;
      await saveSession(session);
      render();
      showToast(exercise + ' ajouté à la séance ✓');
    }

    else if(action === 'delete-exercise-from-session'){
      const session = state.sessions[el.dataset.session];
      if(!session) return;
      session.exercises = session.exercises.filter(x => x.id !== el.dataset.id);
      await saveSession(session);
      render();
    }

    else if(action === 'finish-session'){
      const session = state.sessions[el.dataset.id];
      if(!session) return;
      session.status = 'terminee';
      const analysis = computeSessionAnalysis(session);
      await saveSession(session);
      state.sessionAnalysisData = analysis;
      state.sessionAnalysisOpen = true;
      render();
    }

    else if(action === 'toggle-session-status'){
      const session = state.sessions[el.dataset.id];
      if(!session) return;
      const becomingDone = session.status !== 'terminee';
      session.status = becomingDone ? 'terminee' : 'planifiee';
      const analysis = becomingDone ? computeSessionAnalysis(session) : null;
      await saveSession(session);
      if(becomingDone){
        state.openSessionId = null;
        state.sessionAnalysisData = analysis;
        state.sessionAnalysisOpen = true;
      }
      render();
    }

    else if(action === 'close-session-analysis'){
      state.sessionAnalysisOpen = false;
      state.sessionAnalysisData = null;
      render();

      render();

      render();

      const idx = parseInt(el.dataset.idx, 10);
      const i = state.aiPlanDays.indexOf(idx);
      if(i === -1) state.aiPlanDays.push(idx);
      else state.aiPlanDays.splice(i, 1);

        kcal = typeObj.met * 3.5 * weight / 200 * duration;

        magnesium: parseFloat(document.getElementById('cf-magnesium').value) || 0,

      await saveCustomFood(food);

      state.settingsOpen = false;

      showToast('Couleurs mises à jour ✓');
    }

    else if(action === 'reset-theme'){
      state.theme = { ...DEFAULT_THEME };
      applyThemeVars(state.theme);
      await saveTheme(state.theme);
      state.settingsOpen = false;
      render();
      showToast('Couleurs réinitialisées ✓');

    else if(action === 'open-weekly-recap'){
      const dates = getPreviousWeekDates();
      state.weeklyRecapOpen = true;
      state.weeklyRecapWeekStart = dates[0];

      profile.targets = computeTargets(profile);
      await saveProfile(profile);

      showToast('Objectifs mis à jour ✓');

  document.addEventListener('change', (e) => {
    if(e.target.id && e.target.id.endsWith('-exercise-select')){
      const prefix = e.target.id.replace('-exercise-select', '');
      const wrap = document.getElementById(prefix+'-exercise-custom-wrap');
      if(wrap) wrap.style.display = e.target.value === '__custom__' ? 'block' : 'none';
    }
    if(e.target.id && e.target.id.endsWith('-group')){
      const prefix = e.target.id.replace('-group', '');
      const group = e.target.value;
      state.trainingLastGroup = group;
      const exerciseSelect = document.getElementById(prefix+'-exercise-select');
      if(exerciseSelect){
        const exercises = EXERCISE_DB[group] || [];
        exerciseSelect.innerHTML = `
          <option value="">Choisir un exercice…</option>
          ${exercises.map(ex => `<option value="${ex}">${ex}</option>`).join('')}
          <option value="__custom__">+ Autre (exercice personnalisé)</option>
        `;
      }
      const wrap = document.getElementById(prefix+'-exercise-custom-wrap');
      if(wrap) wrap.style.display = 'none';
    }
    if(e.target.id === 'photo-input'){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = async () => {
          const size = 320;
          const scale = Math.max(size / img.width, size / img.height);
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          state.profilePhotoDraft = dataUrl;
          if(state.profile){
            state.profile.photo = dataUrl;
            await saveProfile(state.profile);
          }
          render();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
  });

  document.addEventListener('input', (e) => {
    if(e.target.id === 'food-search'){
      state.searchQuery = e.target.value;
      render();
    }
    if(e.target.id === 'portion-input'){
      const v = parseFloat(e.target.value);
      state.portionGrams = isNaN(v) ? 0 : v;
      render();
    }
    if(e.target.id === 'manual-kcal'){
      state.manualValues.kcal = parseFloat(e.target.value) || 0;
    }
    if(e.target.id === 'manual-protein'){
      state.manualValues.protein = parseFloat(e.target.value) || 0;
    }
    if(e.target.id === 'manual-carbs'){
      state.manualValues.carbs = parseFloat(e.target.value) || 0;
    }
    if(e.target.id === 'manual-fat'){
      state.manualValues.fat = parseFloat(e.target.value) || 0;
    }
  });

  loadAll();
})();
</script>
</body>
</html>
